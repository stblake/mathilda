name: Tests (ctest)

# build.yml proves the tree COMPILES on Linux and Windows; nothing ran the
# CMake test suite, so it drifted unseen -- by 2026-10-26, 42 of 417 suites
# failed, and dsolve_tests had stopped at its 37th test for weeks with ~250
# later tests never running. This workflow runs it.
#
# Two tiers, chosen by the `nightly` ctest label (tests/CMakeLists.txt, end):
#   push / pull_request   ctest -LE nightly   -- every unit suite (~320)
#   schedule / dispatch   ctest               -- adds the corpus replays,
#                         stress batteries and bench_* timing gates (~97),
#                         about 80% of the suite's serial time.

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "makefile", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "makefile", ".github/workflows/tests.yml"]
  schedule:
    - cron: "17 15 * * *"   # daily; off the hour, when runners are less loaded
  workflow_dispatch:
    inputs:
      tier:
        description: "push (unit suites) or full (adds corpus/stress/bench)"
        type: choice
        options: [full, push]
        default: full
      filter:
        description: "ctest -R regex (empty = the whole tier)"
        type: string
        default: ""
      sanitize:
        description: "build the suites with AddressSanitizer + UBSan"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same ref supersedes a running push-tier job.
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  ctest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'full') }}
      FILTER: ${{ inputs.filter }}
      SANITIZE: ${{ inputs.sanitize && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      # Same optional dependencies as build.yml, so the suites exercise the
      # FLINT/LAPACK/PCRE2/FFTW/ECM paths users get.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libgmp-dev libmpfr-dev libreadline-dev \
            libecm-dev liblapacke-dev libopenblas-dev \
            libflint-dev libpcre2-dev libfftw3-dev \
            libsuitesparse-dev libarpack2-dev
          sudo apt-get install -y --no-install-recommends libraylib-dev libx11-dev \
            || echo "raylib unavailable -- tests build with USE_GRAPHICS=OFF"

      # The sanitizer build is for chasing a crash that only this platform's
      # allocator exposes (dispatch with sanitize: true and a filter).
      - name: Configure
        run: |
          if [ "$SANITIZE" = "true" ]; then
            san="-fsanitize=address,undefined -fno-omit-frame-pointer"
            cmake -S tests -B tests/build -DCMAKE_C_FLAGS="-O1 -g $san" \
                  -DCMAKE_EXE_LINKER_FLAGS="$san"
          else
            cmake -S tests -B tests/build
          fi

      # Every suite links the whole library; 587 sanitizer-instrumented copies
      # do not fit on a runner's disk, so a filtered run builds only its own
      # targets (each ctest name is its executable's name).
      - name: Build test suites
        run: |
          if [ -n "$FILTER" ]; then
            # Build targets are the tests' EXECUTABLES, not the test names: a
            # corpus test (mathar_definite_corpus_tests) runs a shared driver
            # (mathar_corpus_tests) with arguments.  The command is read from
            # CTestTestfile.cmake, which the configure step writes: ctest itself
            # (`-N -V`, `--show-only=json-v1`) reports a command only for an
            # executable that is ALREADY built, so here, before the build, both
            # gave nothing.  Names come from `ctest -N -R` (which needs no
            # build).  Only executables inside the build tree are targets; a
            # test run by python3 adds none.
            tg=$(cd tests/build && ctest -N -R "$FILTER" | sed -n 's/^ *Test *#[0-9]*: //p' | python3 -c '
          import os, re, sys
          b = os.getcwd()
          want = set(sys.stdin.read().split())
          src = open("CTestTestfile.cmake").read()
          cmd = {}
          for m in re.finditer(r"add_test\((?:\[=\[(.*?)\]=\]|(\S+))\s+\"([^\"]+)\"", src):
              cmd[m.group(1) or m.group(2)] = m.group(3)
          print(" ".join(sorted({os.path.basename(cmd[n]) for n in want
                                 if n in cmd and cmd[n].startswith(b + "/")})))')
            echo "targets: $tg"
            if [ -n "$tg" ]; then
              cmake --build tests/build -j"$(nproc)" --target $tg
            else
              echo "filter '$FILTER' names no C test executable (script-driven tests only)"
            fi
          else
            cmake --build tests/build -j"$(nproc)"
          fi

      # --timeout is per test: dsolve_corpus_2_1_2 takes ~25 min on a laptop.
      # --repeat until-pass:2 is deliberately absent; a flaky suite should fail.
      - name: Run ctest
        working-directory: tests/build
        run: |
          if [ "$FULL" = "true" ]; then sel=""; to=3600; else sel="-LE nightly"; to=900; fi
          # A dispatched filter names the suites someone wants to READ (a bench
          # table to record a baseline from, a corpus summary): print their
          # output even when they pass.
          [ -n "$FILTER" ] && sel="$sel -R $FILTER -V"
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 UBSAN_OPTIONS=print_stacktrace=1
          # Keep a core of every crash: an intermittent one (a timing-dependent
          # crash under -j load) does not recur in the serial gdb rerun below.
          # %E is the executable's path with '/' written as '!'.
          mkdir -p /tmp/cores && chmod 1777 /tmp/cores
          sudo sysctl -q -w kernel.core_pattern='/tmp/cores/core.%E.%p' || true
          ulimit -c unlimited
          ctest $sel -j"$(nproc)" --timeout "$to" --output-on-failure \
                --output-junit ctest-junit.xml

      # A crashed suite's block-buffered stdout dies with it, so the log shows
      # nothing past the last flush. Rerun each failed suite unbuffered under
      # gdb: the last test name it printed, and a backtrace if it crashes.
      - name: Backtraces for failed suites
        if: failure()
        working-directory: tests/build
        run: |
          sudo apt-get install -y --no-install-recommends gdb >/dev/null
          # The crash as it happened under load, from its core (see Run ctest).
          for c in /tmp/cores/core.*; do
            [ -f "$c" ] || continue
            exe=$(basename "$c" | sed 's/^core\.//; s/\.[0-9]*$//' | tr '!' '/')
            echo "::group::core $(basename "$exe")"
            gdb -q -batch -ex bt -ex 'info registers rip' "$exe" "$c" 2>&1 | tail -60
            echo "::endgroup::"
          done
          f=Testing/Temporary/LastTestsFailed.log
          [ -f "$f" ] || exit 0
          for t in $(cut -d: -f2 "$f"); do
            [ -x "./$t" ] || continue
            echo "::group::$t"
            timeout 900 stdbuf -o0 -e0 gdb -q -batch -ex run -ex bt -ex quit --args "./$t" 2>&1 \
              | grep -v "^\[New Thread\|^\[Thread .* exited\|Solve::ifun" | tail -80
            echo "::endgroup::"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ env.FULL == 'true' && 'full' || 'push' }}
          path: |
            tests/build/ctest-junit.xml
            tests/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
