name: Linux build

# Mathilda is developed on macOS but shipped to Linux users, and the two
# platforms disagree about what `-std=c99` means. glibc hides every POSIX
# symbol under it (M_PI, jn, yn, strdup, ...) while Darwin's headers expose
# them regardless, so an unguarded use compiles clean locally and reaches users
# as a build failure — issue #36 (M_PI) and issue #37 (jn/yn) were both exactly
# this, found by a user rather than by us.
#
# This job is the backstop: a real glibc compile of the whole tree with the
# same flags the makefile uses. `make check-c99` runs first because it names
# the offending symbol and prints the fix, which a raw compiler error does not.

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "makefile", "tools/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "makefile", "tools/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The optional dependencies are installed so the autodetected code paths
      # (FLINT, LAPACKE, PCRE2, FFTW, ECM, raylib) are actually COMPILED here.
      # Degrading gracefully is fine for a user; for this job it would mean
      # silently not checking the very files most likely to break.
      - name: Install dependencies
        id: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libmpfr-dev libreadline-dev \
            libecm-dev liblapacke-dev libopenblas-dev \
            libflint-dev libpcre2-dev libfftw3-dev
          # raylib is universe-only and not on every runner image. USE_GRAPHICS
          # degrades to a text placeholder without it, so this one is allowed to
          # fail — but when it succeeds the renderer needs -lX11 spelled out, as
          # in the invocation from issue #37.
          if sudo apt-get install -y --no-install-recommends libraylib-dev libx11-dev; then
            echo 'extra_libs=-llapack -lblas -lX11' >> "$GITHUB_OUTPUT"
          else
            echo "raylib unavailable — building with the placeholder renderer"
            echo 'extra_libs=-llapack -lblas' >> "$GITHUB_OUTPUT"
          fi

      # `make print-cc`, not `gcc --version`: the makefile prefers a versioned
      # gcc-NN over the plain name, so on this runner a bare `gcc --version`
      # reports 13.3.0 while the build actually uses gcc-14. That mismatch sent
      # issue #40's diagnosis to the wrong compiler.
      - name: Report toolchain
        run: make print-cc

      # Optional dependencies degrade silently by design, which means a code
      # path can quietly stop being covered here. Surface why each one was or
      # was not picked up, so a gap is a decision rather than an accident.
      - name: Dependency detection report
        run: |
          echo "--- flint";  pkg-config --modversion flint || echo "no flint.pc"
          echo "libs: $(pkg-config --libs flint)"
          echo "--- ecm (compile+link probe, same as the makefile's)"
          printf '#include <stdio.h>\n#include <ecm.h>\nint main(void){ecm_params p;ecm_init(p);return 0;}\n' > /tmp/ecmprobe.c
          gcc /tmp/ecmprobe.c -o /tmp/ecmprobe -lecm -lgmp && echo "ecm probe OK" \
            || echo "ecm probe FAILED — see the error above"
          echo "--- raylib"; pkg-config --exists raylib && echo "raylib.pc present" || echo "no raylib.pc"
          apt-cache policy libraylib-dev 2>/dev/null | head -3

      # Fast, specific failure: names the symbol and prints the guard to add.
      - name: Portability gate (make check-c99)
        run: make check-c99

      # A head with an NDArray fast path that is not on pack.c's AWARE list is
      # correct, silent and 30x-658x slow. Source-level, so it needs no build.
      - name: Packed-array opt-in audit (make check-packed-aware)
        run: make check-packed-aware

      # The definitive check — glibc headers, -std=c99, the real flag set.
      - name: Build
        run: make -j"$(nproc)" EXTRA_LIBS="${{ steps.deps.outputs.extra_libs }}"

      # Piped stdin switches the REPL from readline to its NDJSON sidecar
      # protocol, so the smoke test speaks that — and asserts on the answer,
      # because `echo expr | ./Mathilda` produces nothing and still exits 0.
      # The BesselJ line is the issue #37 path specifically: built with
      # `-fpermissive` (the workaround users were reaching for), an implicit
      # `jn` is assumed to return `int` and every value comes back truncated.
      - name: Smoke test
        run: |
          out=$(printf '%s\n' \
            '{"id": 1, "expr": "Integrate[1/(x^3 + 1), x]"}' \
            '{"id": 2, "expr": "Normal[BesselJ[2, NDArray[{2.5, 3.5}]]]"}' \
            '{"id": 3, "expr": "PolynomialExtendedGCD[x^4 - 1, x^2 - 1, x]"}' \
            '{"type": "quit"}' | ./Mathilda)
          echo "$out"
          echo "$out" | grep -q '0\.44605' || {
            echo "::error::BesselJ NDArray kernel returned the wrong value (issue #37)"
            exit 1
          }
          # Exercises the pre-3.2 gr_poly_xgcd_euclidean fallback, which only
          # compiles in on the older FLINT the distros ship — never locally.
          echo "$out" | grep -q '{-1 + x\^2, {0, 1}}' || {
            echo "::error::PolynomialExtendedGCD wrong — check the FLINT xgcd compat shim"
            exit 1
          }

  # ---------------------------------------------------------------------------
  # THE GRAPHICS LINK, WHICH NOTHING ELSE BUILDS.
  #
  # Issue #65: `src/imageio.c` vendors stb_image, raylib's libraylib.a bakes in its own copy, and
  # with USE_GRAPHICS=1 on Linux the two collided -- dozens of `multiple definition of 'stbi_load'`.
  # It reached a user because the failing configuration was built by NOBODY: on macOS ld64 tolerates
  # duplicate symbols across archives where GNU ld makes it an error, and the `build` job above is
  # allowed to continue when libraylib-dev is unavailable, which on these runners it always is
  # ("E: Unable to locate package libraylib-dev"). So every CI run built USE_GRAPHICS=0.
  #
  # This job exists to make that configuration real, and it must FAIL rather than degrade: a job
  # that quietly builds the placeholder renderer is what hid the bug in the first place. raylib is
  # built from source because it is not in this image's package set, which is also why the apt
  # attempt in `build` kept failing.
  build-graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libmpfr-dev libreadline-dev \
            libecm-dev liblapacke-dev libopenblas-dev \
            libflint-dev libpcre2-dev libfftw3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev cmake

      # Pinned to 5.5, the version the makefile's detection and the renderer were written against.
      - name: Build raylib from source
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/raylib/build -j"$(nproc)"
          sudo cmake --install /tmp/raylib/build
          pkg-config --exists raylib || {
            echo "::error::raylib.pc missing after install — this job cannot verify the graphics link"
            exit 1
          }
          echo "raylib $(pkg-config --modversion raylib) installed"

      - name: Report toolchain
        run: make print-cc

      # The real thing: a graphics-enabled link against a real raylib.
      - name: Build with USE_GRAPHICS=1
        run: make -j"$(nproc)" USE_GRAPHICS=1 EXTRA_LIBS="-llapack -lblas -lX11"

      # The regression test for #65, independent of raylib's own symbol choices: our stb copy must
      # export NOTHING. `nm` shows `t` (local) for a static function and `T` (global) for an
      # exported one, and one exported `stbi_*` is all it takes to collide with any other library
      # that vendors stb -- raylib today, something else tomorrow.
      - name: Assert the vendored stb symbols are file-local (issue #65)
        run: |
          # `_?` because Mach-O prefixes symbols with an underscore; this job is Linux, but the
          # same line is then usable by hand on a Mac, where ' T stbi_' silently matches nothing.
          if nm src/imageio.o | grep -qE ' T _?stbi_'; then
            echo "::error::src/imageio.o exports stbi_* symbols; add STB_IMAGE_STATIC / STB_IMAGE_WRITE_STATIC"
            nm src/imageio.o | grep -E ' T _?stbi_' | head -10
            exit 1
          fi
          echo "no exported stbi_* symbols in imageio.o"

      - name: Smoke test the image round trip
        run: |
          out=$(printf '%s\n' \
            '{"id": 1, "expr": "ImageDimensions[Import[Export[\"/tmp/ci.png\", Image[Table[N[(i + j)/32], {i, 1, 16}, {j, 1, 24}], \"Real\"]]]]"}' \
            '{"type": "quit"}' | ./Mathilda)
          echo "$out"
          echo "$out" | grep -q '{24, 16}' || {
            echo "::error::PNG round trip through Import/Export failed"
            exit 1
          }

  # ---------------------------------------------------------------------------
  # THE TEST SUITE, WHICH NOTHING ELSE RUNS.
  #
  # Until this job, "the tests pass" was only ever a human claim: CI compiled the tree and ran two
  # source-level gates, and running the 400+ binaries was left to whoever remembered. A PR then
  # reported them as passing on the strength of 40 of 426. A machine cannot sample by accident.
  #
  # tests/known_failures.txt keeps this honest without making it useless: a listed failure does not
  # fail the job, an unlisted one does, and a listed test that starts passing is reported so the
  # line can go. A gate that is red on arrival gets ignored.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libmpfr-dev libreadline-dev \
            libecm-dev liblapacke-dev libopenblas-dev \
            libflint-dev libpcre2-dev libfftw3-dev cmake

      - name: Report toolchain
        run: make print-cc

      # One command, pinned configuration, every binary. See the header of the script for why the
      # configuration is spelled out rather than inherited from whatever the tree was left in.
      - name: Build and run every test binary
        run: tools/run_test_suite.sh

  # MPFR is on by default (USE_MPFR=1) and arbitrary-precision reals (EXPR_MPFR)
  # are used across ~130 files, so the `make USE_MPFR=0` graceful-degrade config
  # rots easily: a new unguarded EXPR_MPFR case or *_dispatch_mpfr branch builds
  # fine locally (default USE_MPFR=1) and only breaks the no-MPFR build. This job
  # is the backstop. FLINT transitively pulls in mpfr.h, which masks a subset of
  # unguarded uses (bare mpfr_prec_t) — so the build below turns FLINT OFF too,
  # making it a true no-MPFR compile. The stricter local check is
  # `make USE_MPFR=0 USE_FLINT=0`.
  build-no-mpfr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libreadline-dev libpcre2-dev libfftw3-dev

      - name: Report toolchain
        run: make print-cc

      # Build the whole tree with MPFR (and FLINT, to avoid mpfr leakage) off.
      - name: Build (USE_MPFR=0)
        run: make -j"$(nproc)" USE_MPFR=0 USE_FLINT=0 USE_ECM=0 USE_LAPACK=0 USE_GRAPHICS=0

      # Confirm the no-MPFR binary runs and degrades gracefully: N[Pi, 50] must
      # not crash — it falls back to machine precision with an N::prec warning.
      - name: Smoke test
        run: |
          out=$(printf '%s\n' \
            '{"id": 1, "expr": "2 + 3"}' \
            '{"id": 2, "expr": "Factor[x^2 - 1]"}' \
            '{"id": 3, "expr": "N[Pi, 50]"}' \
            '{"type": "quit"}' | ./Mathilda)
          echo "$out"
          echo "$out" | grep -q '"payload":"5"' || {
            echo "::error::no-MPFR binary did not evaluate 2 + 3"
            exit 1
          }
          # N[Pi, 50] must degrade gracefully to machine precision, not crash.
          echo "$out" | grep -q '"payload":"3.14159"' || {
            echo "::error::no-MPFR N[Pi, 50] did not fall back to machine precision"
            exit 1
          }
