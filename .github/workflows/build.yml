name: Linux build

# Mathilda is developed on macOS but shipped to Linux users, and the two
# platforms disagree about what `-std=c99` means. glibc hides every POSIX
# symbol under it (M_PI, jn, yn, strdup, ...) while Darwin's headers expose
# them regardless, so an unguarded use compiles clean locally and reaches users
# as a build failure — issue #36 (M_PI) and issue #37 (jn/yn) were both exactly
# this, found by a user rather than by us.
#
# This job is the backstop: a real glibc compile of the whole tree with the
# same flags the makefile uses. `make check-c99` runs first because it names
# the offending symbol and prints the fix, which a raw compiler error does not.

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "makefile", "tools/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "makefile", "tools/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The optional dependencies are installed so the autodetected code paths
      # (FLINT, LAPACKE, PCRE2, FFTW, ECM, raylib) are actually COMPILED here.
      # Degrading gracefully is fine for a user; for this job it would mean
      # silently not checking the very files most likely to break.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libmpfr-dev libreadline-dev \
            libecm-dev liblapacke-dev libopenblas-dev \
            libflint-dev libpcre2-dev libfftw3-dev
          # raylib is universe-only and not on every runner image. USE_GRAPHICS
          # degrades to a text placeholder without it, so this one is allowed to
          # fail. libx11-dev is installed alongside it so the transitive -lX11
          # that `pkg-config --static --libs raylib` emits (makefile raylib
          # block, issue #18) resolves at link — no manual EXTRA_LIBS needed.
          sudo apt-get install -y --no-install-recommends libraylib-dev libx11-dev \
            || echo "raylib unavailable — building with the placeholder renderer"

      # `make print-cc`, not `gcc --version`: the makefile prefers a versioned
      # gcc-NN over the plain name, so on this runner a bare `gcc --version`
      # reports 13.3.0 while the build actually uses gcc-14. That mismatch sent
      # issue #40's diagnosis to the wrong compiler.
      - name: Report toolchain
        run: make print-cc

      # Optional dependencies degrade silently by design, which means a code
      # path can quietly stop being covered here. Surface why each one was or
      # was not picked up, so a gap is a decision rather than an accident.
      - name: Dependency detection report
        run: |
          echo "--- flint";  pkg-config --modversion flint || echo "no flint.pc"
          echo "libs: $(pkg-config --libs flint)"
          echo "--- ecm (compile+link probe, same as the makefile's)"
          printf '#include <stdio.h>\n#include <ecm.h>\nint main(void){ecm_params p;ecm_init(p);return 0;}\n' > /tmp/ecmprobe.c
          gcc /tmp/ecmprobe.c -o /tmp/ecmprobe -lecm -lgmp && echo "ecm probe OK" \
            || echo "ecm probe FAILED — see the error above"
          echo "--- raylib"; pkg-config --exists raylib && echo "raylib.pc present" || echo "no raylib.pc"
          apt-cache policy libraylib-dev 2>/dev/null | head -3

      # Fast, specific failure: names the symbol and prints the guard to add.
      - name: Portability gate (make check-c99)
        run: make check-c99

      # A head with an NDArray fast path that is not on pack.c's AWARE list is
      # correct, silent and 30x-658x slow. Source-level, so it needs no build.
      - name: Packed-array opt-in audit (make check-packed-aware)
        run: make check-packed-aware

      # The definitive check — glibc headers, -std=c99, the real flag set. This
      # runs the EXACT command a user runs (plain `make`, no EXTRA_LIBS): the
      # makefile now supplies the LAPACK/BLAS transitive libs (-llapack -lblas)
      # and raylib's transitive -lX11 itself, so a missing-library bug that
      # breaks a user's `git clone && make` can no longer hide behind a CI-only
      # crutch. If a link fails here, the fix belongs in the makefile, not here.
      - name: Build
        run: make -j"$(nproc)"

      # Piped stdin switches the REPL from readline to its NDJSON sidecar
      # protocol, so the smoke test speaks that — and asserts on the answer,
      # because `echo expr | ./Mathilda` produces nothing and still exits 0.
      # The BesselJ line is the issue #37 path specifically: built with
      # `-fpermissive` (the workaround users were reaching for), an implicit
      # `jn` is assumed to return `int` and every value comes back truncated.
      - name: Smoke test
        run: |
          out=$(printf '%s\n' \
            '{"id": 1, "expr": "Integrate[1/(x^3 + 1), x]"}' \
            '{"id": 2, "expr": "Normal[BesselJ[2, NDArray[{2.5, 3.5}]]]"}' \
            '{"id": 3, "expr": "PolynomialExtendedGCD[x^4 - 1, x^2 - 1, x]"}' \
            '{"type": "quit"}' | ./Mathilda)
          echo "$out"
          echo "$out" | grep -q '0\.44605' || {
            echo "::error::BesselJ NDArray kernel returned the wrong value (issue #37)"
            exit 1
          }
          # Exercises the pre-3.2 gr_poly_xgcd_euclidean fallback, which only
          # compiles in on the older FLINT the distros ship — never locally.
          echo "$out" | grep -q '{-1 + x\^2, {0, 1}}' || {
            echo "::error::PolynomialExtendedGCD wrong — check the FLINT xgcd compat shim"
            exit 1
          }

  # MPFR is on by default (USE_MPFR=1) and arbitrary-precision reals (EXPR_MPFR)
  # are used across ~130 files, so the `make USE_MPFR=0` graceful-degrade config
  # rots easily: a new unguarded EXPR_MPFR case or *_dispatch_mpfr branch builds
  # fine locally (default USE_MPFR=1) and only breaks the no-MPFR build. This job
  # is the backstop. FLINT transitively pulls in mpfr.h, which masks a subset of
  # unguarded uses (bare mpfr_prec_t) — so the build below turns FLINT OFF too,
  # making it a true no-MPFR compile. The stricter local check is
  # `make USE_MPFR=0 USE_FLINT=0`.
  build-no-mpfr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libreadline-dev libpcre2-dev libfftw3-dev

      - name: Report toolchain
        run: make print-cc

      # Build the whole tree with MPFR (and FLINT, to avoid mpfr leakage) off.
      - name: Build (USE_MPFR=0)
        run: make -j"$(nproc)" USE_MPFR=0 USE_FLINT=0 USE_ECM=0 USE_LAPACK=0 USE_GRAPHICS=0

      # Confirm the no-MPFR binary runs and degrades gracefully: N[Pi, 50] must
      # not crash — it falls back to machine precision with an N::prec warning.
      - name: Smoke test
        run: |
          out=$(printf '%s\n' \
            '{"id": 1, "expr": "2 + 3"}' \
            '{"id": 2, "expr": "Factor[x^2 - 1]"}' \
            '{"id": 3, "expr": "N[Pi, 50]"}' \
            '{"type": "quit"}' | ./Mathilda)
          echo "$out"
          echo "$out" | grep -q '"payload":"5"' || {
            echo "::error::no-MPFR binary did not evaluate 2 + 3"
            exit 1
          }
          # N[Pi, 50] must degrade gracefully to machine precision, not crash.
          echo "$out" | grep -q '"payload":"3.14159"' || {
            echo "::error::no-MPFR N[Pi, 50] did not fall back to machine precision"
            exit 1
          }
